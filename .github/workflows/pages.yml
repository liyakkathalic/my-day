# On every push to main, and every morning at 6:00 AM India time (to refresh
# today's quote): run the tests, build the device-only edition and publish it
# to the gh-pages branch (GitHub Pages serves that branch).
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
      - run: node scripts/fetch-quote.mjs
      - name: Push dist-pages to the gh-pages branch
        run: |
          cd dist-pages
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
